{% extends 'base.html' %}

{% block title %}Comparison - AoG Analytics{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="fa-solid fa-code-compare text-danger me-2"></i> So Sánh Hiệu Năng: Apriori vs FP-Growth</h2>
    <button class="btn btn-primary" onclick="compareAlgorithms()">
        <i class="fa-solid fa-bolt me-2"></i> Thực Hiện So Sánh
    </button>
</div>

<!-- Biểu đồ so sánh -->
<div class="row g-3 mb-4">
    <div class="col-md-6">
        <div class="card card-custom p-3">
            <h5>Thời Gian Thực Thi (Giây)</h5>
            <div style="height: 250px;">
                <canvas id="timeCompareChart"></canvas>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card card-custom p-3">
            <h5>Số Lượng Tập Phổ Biến Khai Phá Được</h5>
            <div style="height: 250px;">
                <canvas id="itemsetCompareChart"></canvas>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function compareAlgorithms() {
    fetch('/api/compare', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ min_support: 0.03, min_confidence: 0.5, min_lift: 1.0 })
    })
    .then(res => res.json())
    .then(data => {
        // Vẽ biểu đồ thời gian
        new Chart(document.getElementById('timeCompareChart'), {
            type: 'bar',
            data: {
                labels: ['Apriori', 'FP-Growth'],
                datasets: [{
                    label: 'Thời gian (s)',
                    data: [data.apriori.execution_time_sec, data.fpgrowth.execution_time_sec],
                    backgroundColor: ['#48cae4', '#06d6a0']
                }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });

        // Vẽ biểu đồ tập phổ biến
        new Chart(document.getElementById('itemsetCompareChart'), {
            type: 'bar',
            data: {
                labels: ['Apriori', 'FP-Growth'],
                datasets: [{
                    label: 'Số tập phổ biến',
                    data: [data.apriori.frequent_itemsets_count, data.fpgrowth.frequent_itemsets_count],
                    backgroundColor: ['#48cae4', '#06d6a0']
                }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });
    });
}

// Chạy tự động khi load trang
document.addEventListener('DOMContentLoaded', compareAlgorithms);
</script>
{% endblock %}
