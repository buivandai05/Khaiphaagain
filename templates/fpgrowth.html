{% extends 'base.html' %}

{% block title %}FP-Growth Mining - AoG Analytics{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="fa-solid fa-tree text-success me-2"></i> Khai Phá Bằng FP-Growth</h2>
</div>

<!-- Form cấu hình tham số -->
<div class="card card-custom p-4 mb-4">
    <h5 class="mb-3"><i class="fa-solid fa-sliders me-2"></i> Cấu Hình Ngưỡng Thuật Toán FP-Growth</h5>
    <div class="row g-3">
        <div class="col-md-3">
            <label class="form-label text-muted">Minimum Support</label>
            <input type="number" id="fpMinSup" class="form-control bg-dark text-white border-secondary" step="0.01" value="0.03">
        </div>
        <div class="col-md-3">
            <label class="form-label text-muted">Minimum Confidence</label>
            <input type="number" id="fpMinConf" class="form-control bg-dark text-white border-secondary" step="0.05" value="0.5">
        </div>
        <div class="col-md-3">
            <label class="form-label text-muted">Minimum Lift</label>
            <input type="number" id="fpMinLift" class="form-control bg-dark text-white border-secondary" step="0.1" value="1.0">
        </div>
        <div class="col-md-3 d-flex align-items-end">
            <button class="btn btn-success w-100" id="btnRunFP" onclick="runFPGrowth()">
                <i class="fa-solid fa-play me-2"></i> Chạy FP-Growth
            </button>
        </div>
    </div>
</div>

<!-- Kết quả thống kê -->
<div class="row g-3 mb-4 d-none" id="fpResultStats">
    <div class="col-md-4">
        <div class="stat-card">
            <div class="text-muted small">Thời Gian Thực Thi (FP-Tree)</div>
            <div class="number text-warning" id="fpStatTime">0.000s</div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="stat-card">
            <div class="text-muted small">Số Tập Phổ Biến</div>
            <div class="number text-info" id="fpStatItemsets">0</div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="stat-card">
            <div class="text-muted small">Số Luật Kết Hợp WIN</div>
            <div class="number text-success" id="fpStatRules">0</div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function runFPGrowth() {
    const minSup = parseFloat(document.getElementById('fpMinSup').value);
    const minConf = parseFloat(document.getElementById('fpMinConf').value);
    const minLift = parseFloat(document.getElementById('fpMinLift').value);

    const btn = document.getElementById('btnRunFP');
    btn.disabled = true;

    fetch('/api/compare', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ min_support: minSup, min_confidence: minConf, min_lift: minLift })
    })
    .then(res => res.json())
    .then(data => {
        btn.disabled = false;
        document.getElementById('fpResultStats').classList.remove('d-none');
        document.getElementById('fpStatTime').innerText = data.fpgrowth.execution_time_sec + 's';
        document.getElementById('fpStatItemsets').innerText = data.fpgrowth.frequent_itemsets_count;
        document.getElementById('fpStatRules').innerText = data.fpgrowth.win_rules_count;
    });
}
</script>
{% endblock %}
