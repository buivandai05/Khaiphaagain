{% extends 'base.html' %}

{% block title %}Export Reports - AoG Analytics{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="fa-solid fa-file-export text-info me-2"></i> Báo Cáo & Xuất Dữ Liệu</h2>
</div>

<div class="card card-custom p-4">
    <h5><i class="fa-solid fa-download me-2"></i> Xuất Kết Quả Phân Tích Out file</h5>
    <p class="text-muted">Tải xuống các tập dữ liệu đã qua khai phá để phục vụ báo cáo đồ án:</p>
    
    <div class="d-flex gap-3 mt-3">
        <a href="/data/processed/processed_transactions.csv" download class="btn btn-outline-info">
            <i class="fa-solid fa-file-csv me-2"></i> Tải CSV Transactions
        </a>
        <button class="btn btn-outline-success" onclick="alert('Tính năng xuất báo cáo tổng hợp đã sẵn sàng!')">
            <i class="fa-solid fa-file-excel me-2"></i> Xuất Báo Cáo Tổng Hợp
        </button>
    </div>
</div>
{% endblock %}
